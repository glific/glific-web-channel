server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/chat, /login) must return index.html on a
    # hard refresh instead of a 404. Static assets still resolve normally.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; never cache the HTML entry point.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
